name: Docker Image CI

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

env:
    REGISTRY: ghcr.io

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and push Docker images Silo
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./src/FeedManager.Silo/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name == 'push' }}
                  no-cache: true
                  tags: |
                      ${{ env.REGISTRY }}/csrakowski/feedmanagersilo:latest
                      ${{ env.REGISTRY }}/csrakowski/feedmanagersilo:${{ github.sha }}

            - name: Build and push Docker images WebClient
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./src/FeedManager.WebClient/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name == 'push' }}
                  no-cache: true
                  tags: |
                      ${{ env.REGISTRY }}/csrakowski/feedmanagerweb:latest
                      ${{ env.REGISTRY }}/csrakowski/feedmanagerweb:${{ github.sha }}
